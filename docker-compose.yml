services:
  valobot:
    build:
      context: .
      args:
        PORT: ${PORT:-3000}
    container_name: valobot
    restart: unless-stopped
    # Only reachable from the host itself; the public entrypoint is the Apache reverse proxy (proxy-nw)
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # only what the entrypoint needs to chown ./data and drop to the "node" user; the app itself runs unprivileged
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - TZ=${TIMEZONE:-Europe/Paris}
    volumes:
      - ./data:/app/data
    networks:
      - proxy-nw

networks:
  proxy-nw:
    external: true
