<VirtualHost *:80>
    ServerName valobot.example.com

    RewriteEngine On
    RewriteCond %{SERVER_NAME} =valobot.example.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog logs/valobot_error.log
    CustomLog logs/valobot_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName valobot.example.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem
    IncludeOptional /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyRequests Off

    # Proxy Headers
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # 1. WebSocket Proxy (forwarding to the valobot container on proxy-nw network)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)           ws://valobot:6788/$1 [P,L]

    # Explicit WebSocket proxy path
    ProxyPass /ws ws://valobot:6788/ws
    ProxyPassReverse /ws ws://valobot:6788/ws

    # 2. Main Web App & API Reverse Proxy
    ProxyPass / http://valobot:6788/
    ProxyPassReverse / http://valobot:6788/

    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"

    ErrorLog logs/valobot_error.log
    CustomLog logs/valobot_access.log combined
</VirtualHost>
